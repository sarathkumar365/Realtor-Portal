# Static host for the PWA bundle. www/ is generated by dev/build.mjs and deployed
# from disk (`netlify deploy --dir=www`); there is no build step on Netlify's side.
[build]
  command = "node dev/build.mjs"
  publish = "www"

# The worker must never be served from the HTTP cache: a new deploy is a new
# sw.js, and the browser only learns that by fetching it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# What HtmlService's setXFrameOptionsMode did for the Apps Script version.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
