/* ---- Aura chat ---------------------------------------------------------
   Talks to the Aura Chat service, which is a separate deployment from the
   portal's Apps Script endpoint — window.AURA_BASE, set by dev/build.mjs in the
   generated index.html. The Apps Script host does not set it and never can: its
   pages are served from a googleusercontent.com subdomain whose hash varies, so
   the service cannot allowlist it, and Apps Script cannot stream at all. There,
   auraReady() is false, the button never appears, and #chat falls back to home.

   Streaming is fetch + ReadableStream rather than EventSource, which is GET-only
   (our question and its history do not belong in a URL) and cannot set an
   Authorization header (which would put the bearer token in one). EventSource
   also reconnects on close and cannot tell a finished stream from a dropped one,
   so every answered question would immediately ask itself again. */
var AURA_MODE='realtor', AURA_TURNS=[], AURA_ABORT=null, AURA_SEQ=0, AURA_HOME='', AURA_CID=null;
var AURA_MAX_TURNS=20;    /* matches MAX_HISTORY_TURNS on the server; over it is a 422, not a trim */
/* What localStorage keeps, which is not what the model is sent: a reopened
   thread can be 200 turns and must not shrink to 20 on the next launch. */
var AURA_MAX_KEEP=200;
/* The first thing a realtor sees, so every one of these has to work. "What changed
   this week?" was here and came out: dates in the sheet are month-first and parsed
   day-first, and future dates count as recent (known-issues 1 and 2), so it is the
   one question that reliably answers wrong. Put it back when those are fixed. */
var AURA_SEEDS=[
  'Detached homes under $1M in Brampton',
  'How many projects do we have, and in which cities?',
  'What is our cheapest project right now?',
  'Which builders do we work with the most?'
];
function auraReady(){ return !!window.AURA_BASE; }
function auraBottom(){ var l=$('auraList'); if(l) l.scrollTop=l.scrollHeight; }

function loadChat(){
  /* routeInner has already painted a skeleton into #content behind us; the
     overlay covers it and closeChat() hands the screen back. */
  if(!auraReady()){ go('home'); return; }
  $('content').innerHTML='';
  document.body.classList.add('chat');
  $('aura').hidden=false;
  /* Size the composer before the realtor touches it. Left to the first input
     event, the opening frame keeps whatever height rows="1" produced, which is
     the one state the growth maths never got to correct. */
  auraGrow($('auraInput'));
  auraPaint();
}
function closeChat(){
  if(!$('aura')||$('aura').hidden) return;
  auraStop();
  auraHistClose();
  $('aura').hidden=true;
  document.body.classList.remove('chat');
}
/* Client Mode repaints the whole header, not one word inside it: a realtor has to
   be able to see which mode they are in from arm's length, before turning the
   phone around, not by reading it. */
function auraPaintMode(){
  $('aura').classList.toggle('client',AURA_MODE==='client');
  $('auraChipT').textContent=AURA_MODE==='client'?'Client':'Realtor';
  $('auraChip').setAttribute('aria-pressed',AURA_MODE==='client'?'true':'false');
  $('auraSub').textContent=AURA_MODE==='client'?'Client mode':'Aura Key projects';
}
function auraPaint(){
  var l=$('auraList'); if(!l) return;
  auraPaintMode();
  if(!AURA_TURNS.length){
    l.innerHTML='<div class="aura-empty"><h2>Ask Aura</h2><p>Our projects, in plain English.</p>'
      +AURA_SEEDS.map(function(s){ return '<button class="aura-seed" data-q="'+esc(s)+'">'+esc(s)+'</button>'; }).join('')
      +'</div>';
    l.querySelectorAll('.aura-seed').forEach(function(b){
      b.addEventListener('click',function(){ auraAsk(b.dataset.q); });
    });
    return;
  }
  /* Rebuilt node by node rather than as one innerHTML string, because the
     answers have to go through the same renderer the live stream uses. When
     only the streaming path formatted markdown, a reopened chat showed the
     asterisks the fresh answer had just hidden. */
  l.replaceChildren();
  AURA_TURNS.forEach(function(t,i){
    var wrap=document.createElement('div');
    wrap.className='aura-msg'+(t.role==='user'?' aura-me':'');
    if(t.role==='user'){
      var span=document.createElement('span');
      span.textContent=t.content;
      wrap.appendChild(span);
    } else {
      var ai=document.createElement('div');
      ai.className='aura-ai';
      auraMd(ai,t.content);
      wrap.appendChild(ai);
      /* Answers stored before the feedback row existed have no id, and
         auraFeedbackRow returns null rather than offer an unattributable vote. */
      var prev=AURA_TURNS[i-1];
      var fb=auraFeedbackRow(t,(prev&&prev.role==='user')?prev.content:'',i);
      if(fb) wrap.appendChild(fb);
    }
    l.appendChild(wrap);
  });
  auraBottom();
}
/* Flipping the mode clears the thread on purpose: a realtor-only answer must not
   be one scroll away while a buyer is holding the phone.

   auraStop() is the load-bearing line. Clearing AURA_TURNS does nothing to a
   request already in flight -- its `done` handler pushed the finished
   Realtor-Mode answer into the freshly-cleared Client-Mode thread, and the next
   repaint showed it to the buyer. */
function auraMode(m){
  if(m===AURA_MODE) return;
  auraStop();
  AURA_MODE=m; AURA_TURNS=[]; AURA_CID=null; auraSave(); auraHistClose(); auraPaint();
}
function auraNewChat(){ auraStop(); AURA_TURNS=[]; AURA_CID=null; auraSave(); auraHistClose(); auraPaint(); }

/* ---- the chats panel (AUR-38, AUR-50) ---- */
var AURA_HIST_BUSY=false;
function auraBase(){ return window.AURA_BASE.replace(/\/+$/,''); }
function auraWhen(iso){
  var a=ago(iso); if(a) return a;
  var d=new Date(iso);
  return isNaN(d.getTime())?'':d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}
function auraHistMsg(text,bad){
  var d=document.createElement('div');
  d.className='aura-hist-msg'+(bad?' bad':'');
  d.textContent=text;
  $('auraHistList').replaceChildren(d);
}
function auraHistOpen(){
  var h=$('auraHist'); if(!h) return;
  h.hidden=false;
  requestAnimationFrame(function(){ h.classList.add('on'); });
  $('auraNew').setAttribute('aria-expanded','true');
  $('auraHistX').focus();
  auraHistLoad();
}
function auraHistClose(){
  var h=$('auraHist'); if(!h||h.hidden) return;
  h.classList.remove('on');
  $('auraNew').setAttribute('aria-expanded','false');
  setTimeout(function(){ if(!h.classList.contains('on')) h.hidden=true; },220);
}
function auraHistLoad(){
  if(AURA_HIST_BUSY) return;
  AURA_HIST_BUSY=true;
  auraHistMsg('Loading…');
  fetch(auraBase()+'/conversations',{headers:{'Authorization':'Bearer '+TOKEN}})
  .then(function(r){
    if(r.status===401||r.status===403){ closeChat(); sessionLost(); return null; }
    if(r.status===503) throw new Error('unavailable');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){ if(d) auraHistPaint(d.conversations||[]); })
  .catch(function(e){
    auraHistMsg(navigator.onLine===false
      ? 'You are offline. Earlier chats need a connection.'
      : (String(e.message)==='unavailable'
        ? 'Earlier chats are unavailable right now. Asking still works.'
        : 'Could not load your chats.'),true);
  }).then(function(){ AURA_HIST_BUSY=false; });
}
function auraHistPaint(list){
  if(!list.length){ auraHistMsg('No earlier chats yet.'); return; }
  var box=$('auraHistList');
  box.replaceChildren();
  list.forEach(function(c){
    var b=document.createElement('button');
    b.type='button';
    b.className='aura-hist-row'+(c.id===AURA_CID?' on':'');
    if(c.id===AURA_CID) b.setAttribute('aria-current','true');
    var t=document.createElement('div'); t.className='aura-hist-ttl';
    t.textContent=c.title||'Untitled chat';
    b.appendChild(t);
    var m=document.createElement('div'); m.className='aura-hist-meta';
    if(c.mode==='client'){
      var dot=document.createElement('span');
      dot.className='aura-hist-dot'; dot.setAttribute('aria-hidden','true');
      var lbl=document.createElement('span'); lbl.textContent='Client';
      m.appendChild(dot); m.appendChild(lbl);
    }
    var w=document.createElement('span'); w.textContent=auraWhen(c.updated_at);
    m.appendChild(w);
    b.appendChild(m);
    b.addEventListener('click',function(){ auraOpenThread(c.id); });
    box.appendChild(b);
  });
}
/* The header is repainted from the STORED mode before a single turn renders. */
function auraOpenThread(cid){
  if(cid===AURA_CID){ auraHistClose(); return; }
  auraStop();
  auraHistMsg('Opening…');
  fetch(auraBase()+'/conversations/'+encodeURIComponent(cid),{
    headers:{'Authorization':'Bearer '+TOKEN}
  }).then(function(r){
    if(r.status===401||r.status===403){ closeChat(); sessionLost(); return null; }
    if(r.status===404) throw new Error('gone');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    if(!d) return;
    AURA_MODE=d.mode==='client'?'client':'realtor';
    AURA_CID=d.conversation_id;
    /* Cards are deliberately NOT rebuilt -- see known-issues 5. */
    AURA_TURNS=(d.messages||[]).map(function(m){
      return {
        role:m.role==='user'?'user':'assistant',
        content:m.message||'',
        id:m.id,
        pids:(m.sources||[]).map(function(x){ return x.id; }).filter(Boolean)
      };
    }).filter(function(t){ return t.content; });
    auraSave();
    auraHistClose();
    auraPaint();
  }).catch(function(e){
    auraHistMsg(String(e.message)==='gone'
      ? 'That chat is no longer there.'
      : 'Could not open that chat.',true);
  });
}

function auraSave(){
  try{ localStorage.setItem('ak_aura',JSON.stringify({m:AURA_MODE,c:AURA_CID,t:AURA_TURNS.slice(-AURA_MAX_KEEP)})); }catch(e){}
}
function auraLoad(){
  try{
    var o=JSON.parse(localStorage.getItem('ak_aura')||'null');
    if(o&&o.t&&o.t.length){ AURA_MODE=o.m==='client'?'client':'realtor'; AURA_TURNS=o.t.slice(-AURA_MAX_KEEP); AURA_CID=o.c||null; }
  }catch(e){}
}

/* Reads the SSE framing off the body stream: frames are separated by a blank
   line, and every line we care about starts with `data:`.

   Resolves with true only if a terminating event (`done` or `error`) actually
   arrived. A stream can end without one -- iOS suspends fetch when the app is
   backgrounded, a proxy times out, the container is recycled mid-answer -- and
   that used to resolve silently: the caret kept blinking, the send button stayed
   in its stop state, and because AURA_ABORT was never cleared every later
   question was dropped on the floor with no indication why. Ending without a
   terminator is a failure and has to be reported as one. */
function auraStream(body,on){
  var reader=body.getReader(), dec=new TextDecoder(), buf='', ended=false;
  return (function pump(){
    return reader.read().then(function(r){
      if(r.done){
        // A frame with no trailing blank line is still a frame worth reading.
        if(buf) frames(buf);
        return ended;
      }
      buf+=dec.decode(r.value,{stream:true});
      var i;
      while((i=buf.indexOf('\n\n'))>=0){ frames(buf.slice(0,i)); buf=buf.slice(i+2); }
      return pump();
    });
  })();
  function frames(chunk){
    chunk.split('\n').forEach(function(line){
      if(line.slice(0,5)!=='data:') return;
      var ev; try{ ev=JSON.parse(line.slice(5)); }catch(e){ return; }
      if(ev&&(ev.type==='done'||ev.type==='error')) ended=true;
      on(ev);
    });
  }
}
/* What the model is doing, in words a realtor recognises. This is the whole
   point of streaming tool events: it fills the seconds before the first token
   with something truer than a spinner. */
function auraStep(ev){
  var a=ev.args||{};
  if(ev.tool==='search_projects') return 'Searching'+(a.city?' '+a.city:' our projects')+'…';
  if(ev.tool==='inventory_summary') return 'Counting the inventory…';
  if(ev.tool==='get_project') return 'Looking up '+(a.project_id_or_name||'a project')+'…';
  if(ev.tool==='compare_projects') return 'Comparing…';
  if(ev.tool==='get_recent_projects') return 'Checking what changed…';
  return 'Working…';
}
/* The server sends `TypeName: message`, which is the right shape for the CLI's
   --dev output and the wrong one for a realtor: "PortalError" is not a sentence.
   The raw text still goes to the console, where it is worth having. */
function auraSay(detail){
  var raw=String(detail||'');
  try{ console.warn('[aura]',raw); }catch(e){}
  var m=raw.replace(/^[A-Za-z_]*Error:\s*/,'');
  if(/login required|unauthor/i.test(m)) return 'Aura could not read our records with your session. Sign out and back in.';
  if(/not configured/i.test(m)) return 'Aura is not finished being set up. Tell whoever runs the portal.';
  if(/timeout|timed out/i.test(m)) return 'That took too long. Try again in a moment.';
  if(/too many requests/i.test(m)) return 'You have asked Aura a lot in the last hour. Try again shortly.';
  return m||'Something went wrong.';
}
/* ---- the answer, rendered -------------------------------------------------
   The model writes markdown whether we ask for it or not -- there is no API flag
   that turns it off, and the prompt asking for plain prose is a request, not a
   guarantee. So the client handles what leaks through.

   Deliberately split in two. auraMdParse is pure: text in, plain objects out,
   no DOM, which is what lets dev/verify.mjs run it against real captured model
   output. auraMdRender is the only part that touches the page, and it builds
   nodes -- never innerHTML, and never an attribute of any kind. That matters
   more than the formatting: it means there is no code path where a project
   name or an incentive field becomes markup. An allowlist by construction
   beats sanitising a tree after the fact, because there is nothing to strip.

   Supported, and nothing else: blank-line paragraphs, `*`/`-` list items, and
   **bold**. Anything else stays literal -- a heading or a table showing up as
   text is a signal the prompt needs fixing, not the renderer. */
function auraMdSpans(line){
  var out=[], i=0, n=line.length;
  while(i<n){
    var at=line.indexOf('**',i);
    if(at<0){ out.push({b:false,s:line.slice(i)}); break; }
    var end=line.indexOf('**',at+2);
    /* No closing marker yet -- we are mid-stream, part way through the token.
       Drop the dangling ** rather than showing it: the word arrives unbolded
       and then bolds, instead of flashing as punctuation. */
    if(end<0){
      if(at>i) out.push({b:false,s:line.slice(i,at)});
      out.push({b:false,s:line.slice(at+2)});
      break;
    }
    if(at>i) out.push({b:false,s:line.slice(i,at)});
    out.push({b:true,s:line.slice(at+2,end)});
    i=end+2;
  }
  return out.filter(function(x){ return x.s!==''; });
}
function auraMdParse(text){
  var blocks=[], list=null;
  String(text==null?'':text).split('\n').forEach(function(raw){
    var line=raw.replace(/\s+$/,'');
    var item=line.match(/^\s*[*-]\s+(.*)$/);
    if(item){
      if(!list){ list={t:'ul',items:[]}; blocks.push(list); }
      list.items.push(auraMdSpans(item[1]));
      return;
    }
    list=null;
    if(!line.trim()){ blocks.push({t:'gap'}); return; }
    var last=blocks[blocks.length-1];
    /* A single newline inside a paragraph is a space, as markdown has it. */
    if(last&&last.t==='p'){ last.spans=last.spans.concat(auraMdSpans(' '+line.trim())); return; }
    blocks.push({t:'p',spans:auraMdSpans(line.trim())});
  });
  return blocks.filter(function(b){ return b.t!=='gap'; });
}
function auraMdRender(blocks){
  var frag=document.createDocumentFragment();
  function spans(into,list){
    list.forEach(function(sp){
      var node=document.createTextNode(sp.s);
      if(sp.b){ var b=document.createElement('strong'); b.appendChild(node); node=b; }
      into.appendChild(node);
    });
  }
  blocks.forEach(function(b){
    if(b.t==='ul'){
      var ul=document.createElement('ul');
      b.items.forEach(function(it){ var li=document.createElement('li'); spans(li,it); ul.appendChild(li); });
      frag.appendChild(ul);
    } else {
      var p=document.createElement('p'); spans(p,b.spans); frag.appendChild(p);
    }
  });
  return frag;
}
function auraMd(el,text){ el.replaceChildren(auraMdRender(auraMdParse(text))); }

function auraBusy(on){
  var s=$('auraSend');
  s.classList.toggle('stop',on);
  s.setAttribute('aria-label',on?'Stop':'Send');
  $('auraInput').disabled=false;   // a realtor may type the next question while this one runs
  /* The answer node is rebuilt on every delta, and it lives inside a polite live
     region -- so without this a screen reader re-reads the whole growing answer
     once per token. aria-busy holds the announcement until the stream finishes,
     and then it is read once. */
  var l=$('auraList'); if(l) l.setAttribute('aria-busy',on?'true':'false');
}
function auraStop(){
  if(AURA_ABORT){ try{ AURA_ABORT.abort(); }catch(e){} AURA_ABORT=null; }
  auraBusy(false);
}

/* ---- Feedback (AUR-59, AUR-60) ----
   Never rendered in Client Mode: the phone is turned toward a buyer, and a
   tappable "Report data issue" invites them to press it. Checked at render time,
   so a mode flip repaints it away. */

/* Value is the server's enum, label is what a realtor reads. */
var AURA_ISSUES=[
  ['price_incorrect','Price incorrect'],
  ['deposit_incorrect','Deposit incorrect'],
  ['incentive_outdated','Incentive outdated'],
  ['occupancy_incorrect','Occupancy incorrect'],
  ['missing_project','Missing project'],
  ['source_outdated','Source outdated'],
  ['other','Other']
];
/* Client-minted because until Phase 4 there is no server-side message to key
   on; it becomes the ai_messages id then. */
function auraUid(){
  try{ return crypto.randomUUID(); }catch(e){}
  return 'a-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function auraIco(d){
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    +'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>';
}
var AURA_UP='M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM7 11l4.2-8a2.2 2.2 0 0 1 3 2.9L13 9h5.4a2 2 0 0 1 2 2.4l-1.4 6.4a2 2 0 0 1-2 1.6H7';
var AURA_DOWN='M7 13V4h-3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1zM7 13l4.2 8a2.2 2.2 0 0 0 3-2.9L13 15h5.4a2 2 0 0 0 2-2.4l-1.4-6.4a2 2 0 0 0-2-1.6H7';

function auraPostFeedback(payload){
  if(!auraReady()||!TOKEN) return Promise.reject(new Error('no session'));
  return fetch(window.AURA_BASE.replace(/\/+$/,'')+'/feedback',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body:JSON.stringify(payload)
  }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return true; });
}

/* Votes are remembered per conversation and position, not per turn.id: the id a
   live answer carries is client-minted and the one a reopened answer carries
   comes from the server, so the two never match and a reopened thread offered
   fresh thumbs on an answer already judged. */
function auraVoted(){
  try{ return JSON.parse(localStorage.getItem('ak_aura_fb')||'{}')||{}; }catch(e){ return {}; }
}
function auraVoteKey(idx){ return AURA_CID?(AURA_CID+':'+idx):''; }
function auraMarkVoted(idx,verdict){
  var k=auraVoteKey(idx); if(!k) return;
  try{ var v=auraVoted(); v[k]=verdict; localStorage.setItem('ak_aura_fb',JSON.stringify(v)); }catch(e){}
}

function auraFeedbackRow(turn,question,idx){
  if(AURA_MODE==='client'||!turn||!turn.id||!String(question||'').trim()) return null;
  if(!turn.fb){
    var seen=auraVoted()[auraVoteKey(idx)];
    if(seen) turn.fb=seen;
  }
  var row=document.createElement('div');
  row.className='aura-fb';

  function settled(msg){ row.replaceChildren(); row.className='aura-fb fb-done'; row.textContent=msg; }
  function thanks(verdict){ settled(verdict==='up'?'Thanks — noted.':'Thanks — reported.'); }

  if(turn.fb){ thanks(turn.fb); return row; }

  /* turn.fb is written only after the POST resolves -- otherwise a reopened
     chat says "Thanks" for a report that never left the phone.

     `verdict` may be null: a data issue is a claim about the sheet, not a
     judgement of the answer, and filing it as a thumbs-down corrupts AUR-59. */
  function send(verdict,category,note){
    row.replaceChildren();
    row.className='aura-fb fb-done';
    row.textContent='Sending…';
    auraPostFeedback({
      answer_id:turn.id, question:clip(question,500), verdict:verdict||null,
      category:category||null, note:clip(note,200), project_ids:(turn.pids||[]).slice(0,12)
    }).then(function(){
      turn.fb=verdict||'report'; auraMarkVoted(idx,turn.fb); auraSave();
      thanks(verdict);
    }).catch(function(){
      row.replaceChildren();
      row.className='aura-fb fb-fail';
      var t=document.createElement('span'); t.textContent='Could not send that.';
      var again=document.createElement('button'); again.type='button'; again.textContent='Try again';
      again.addEventListener('click',function(){ send(verdict,category,note); });
      row.appendChild(t); row.appendChild(again);
    });
  }

  function vote(v){
    var b=document.createElement('button');
    b.type='button'; b.className='aura-fbv';
    b.setAttribute('aria-label',v==='up'?'Helpful':'Not helpful');
    b.innerHTML=auraIco(v==='up'?AURA_UP:AURA_DOWN);
    /* Thumbs-down carries its vote into the sheet, so the vote survives even
       if the realtor skips the detail. */
    b.addEventListener('click',function(){ v==='up'?send('up',null,''):sheet('down'); });
    return b;
  }

  /* verdict: 'down' from the thumb, null from "Report data issue". Decides what
     gets filed and whether the left button is Skip or Cancel. */
  function sheet(verdict){
    row.replaceChildren();
    row.className='aura-fb fb-open';
    var h=document.createElement('div'); h.className='aura-fb-h'; h.textContent="What's wrong with it?";
    row.appendChild(h);
    var grid=document.createElement('div'); grid.className='aura-fb-cats';
    var chosen='';
    AURA_ISSUES.forEach(function(c){
      var b=document.createElement('button');
      b.type='button'; b.className='aura-fb-cat'; b.textContent=c[1];
      b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){
        chosen=c[0];
        grid.querySelectorAll('.aura-fb-cat').forEach(function(x){
          var on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on?'true':'false');
        });
        sync();
      });
      grid.appendChild(b);
    });
    row.appendChild(grid);
    var note=document.createElement('input');
    note.className='aura-fb-note'; note.type='text'; note.maxLength=200;
    note.placeholder='Anything else? (optional)';
    note.setAttribute('aria-label','Extra detail');
    row.appendChild(note);
    var acts=document.createElement('div'); acts.className='aura-fb-acts';
    var left=document.createElement('button');
    left.type='button'; left.className='aura-fb-skip';
    left.textContent=verdict?'Skip':'Cancel';
    /* Skip carries the note -- it sits under the note field and reads as "skip
       the category", not "discard what I typed". */
    left.addEventListener('click',function(){
      if(verdict) send(verdict,null,note.value); else buttons();
    });
    var go=document.createElement('button');
    go.type='button'; go.className='aura-fb-go'; go.textContent='Send report'; go.disabled=true;
    go.addEventListener('click',function(){ send(verdict,chosen,note.value); });
    /* A note with no category is still a report, so it enables Send too. */
    function sync(){ go.disabled=!chosen&&!note.value.trim(); }
    note.addEventListener('input',sync);
    acts.appendChild(left); acts.appendChild(go);
    row.appendChild(acts);
    auraBottom();
  }

  /* A function because Cancel comes back to it. */
  function buttons(){
    row.replaceChildren();
    row.className='aura-fb';
    row.appendChild(vote('up'));
    row.appendChild(vote('down'));
    var rep=document.createElement('button');
    rep.type='button'; rep.className='aura-fb-rep'; rep.textContent='Report data issue';
    rep.addEventListener('click',function(){ sheet(null); });
    row.appendChild(rep);
  }

  buttons();
  return row;
}

/* last_updated reaches the client and is deliberately NOT rendered: 10 of the
   23 dated projects parse wrong today (known-issues 1), so a freshness line
   would be a confident wrong date on nearly half. Render it with the fix. */
function auraCards(list){
  return (list||[]).map(function(p){
    return projectCard(p,{price:true,deposit:true,incentive:true});
  }).join('');
}

function auraAsk(q){
  q=String(q||'').trim();
  if(!q||AURA_ABORT) return;
  if(!TOKEN){ closeChat(); showGate(); return; }
  /* Sent only until the server owns the thread. With a conversation id the
     server has the real turns and ignores these, so shipping them is just
     tokens and a claim the client is not entitled to make. Kept for phones that
     have not updated, and for the first question of a new chat. */
  var history=AURA_CID?[]:AURA_TURNS.slice(-AURA_MAX_TURNS).map(function(t){ return {role:t.role,content:t.content}; });
  var l=$('auraList');
  if(!AURA_TURNS.length) l.innerHTML='';          // clear the starter prompts
  /* Kept by reference, not by position. Retry used to pop() the last turn on the
     assumption it was this question's -- but an error bubble stays on screen, so
     a realtor who gives up, asks something else, then scrolls back and taps
     "Try again" would have popped the NEWER answer instead. */
  var myTurn={role:'user',content:q};
  AURA_TURNS.push(myTurn);
  var id='aura'+(++AURA_SEQ);
  l.insertAdjacentHTML('beforeend',
    '<div class="aura-msg aura-me"><span>'+esc(q)+'</span></div>'
    +'<div class="aura-msg" id="'+id+'"><div class="aura-step">Thinking…</div><div class="aura-ai on"></div><div class="aura-cards"></div></div>');
  auraBottom(); auraBusy(true);
  var wrap=$(id), step=wrap.querySelector('.aura-step'),
      body=wrap.querySelector('.aura-ai'), cards=wrap.querySelector('.aura-cards'), text='', pids=[];
  function finish(){ AURA_ABORT=null; auraBusy(false); if(step&&step.parentNode) step.remove(); body.classList.remove('on'); }
  function failed(msg){
    finish();
    /* Replaces the answer rather than appending under it: half an answer that
       reads like a whole one is worse than no answer. */
    wrap.innerHTML='<div class="aura-err">'+esc(msg)+'<br><button type="button">Try again</button></div>';
    wrap.querySelector('button').addEventListener('click',function(){
      wrap.remove();
      var ix=AURA_TURNS.indexOf(myTurn);       // this question's turn, wherever it now sits
      if(ix>=0) AURA_TURNS.splice(ix,1);
      auraAsk(q);
    });
    auraBottom();
  }
  AURA_ABORT=new AbortController();
  fetch(window.AURA_BASE.replace(/\/+$/,'')+'/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body:JSON.stringify({question:q,mode:AURA_MODE,history:history,conversation_id:AURA_CID}),
    signal:AURA_ABORT.signal
  }).then(function(r){
    if(r.status===401||r.status===403){ closeChat(); sessionLost(); return null; }
    if(r.status===429){
      var wait=parseInt(r.headers.get('Retry-After')||'0',10);
      failed(wait>90
        ? 'You have asked Aura a lot in the last hour. Try again in about '+Math.ceil(wait/60)+' minutes.'
        : 'You have asked Aura a lot in the last hour. Try again in a moment.');
      return null;
    }
    if(!r.ok||!r.body) throw new Error('HTTP '+r.status);
    return auraStream(r.body,function(ev){
      if(ev.type==='start'){
        /* The mode the server actually applied, not the one we believe we sent. */
        AURA_MODE=ev.mode==='client'?'client':'realtor'; auraPaintMode();
        /* Assigned unconditionally, including back to null. Only setting it
           when truthy made a stale id permanent: the server refuses one it does
           not own and answers null, and the old code kept the refused id -- so
           every later question sent it again with an empty history, and the
           thread was never stored and never had context. Null here means the
           server has no store; we go back to sending our own turns. */
        AURA_CID=ev.conversation_id||null;
      } else if(ev.type==='tool'){ if(step) step.textContent=auraStep(ev); }
      else if(ev.type==='tool_result'){ if(step&&ev.count) step.textContent+=' found '+ev.count; }
      else if(ev.type==='text'){
        if(step&&step.parentNode) step.remove();
        text+=ev.text;
        auraMd(body,text);          /* nodes, never innerHTML: model output is data, not markup */
        auraBottom();
      }
      else if(ev.type==='projects'){
        cards.innerHTML=auraCards(ev.projects);
        /* Ids only: feedback needs to say which project a report is about. */
        pids=(ev.projects||[]).map(function(p){ return p.id; }).filter(Boolean);
        auraBottom();
      }
      else if(ev.type==='done'){
        finish();
        var ansTurn={role:'assistant',content:text,id:auraUid(),pids:pids};
        AURA_TURNS.push(ansTurn);
        auraSave();
        var fb=auraFeedbackRow(ansTurn,q,AURA_TURNS.length-1);
        if(fb) wrap.appendChild(fb);
        auraBottom();
      }
      else if(ev.type==='error'){ failed(auraSay(ev.detail)); }
    }).then(function(ended){
      /* The stream closed without saying how it finished. Nothing above ran, so
         say so rather than leaving a caret blinking under a half-answer. */
      if(ended===false) failed(text
        ? 'The answer was cut off. Try again.'
        : 'The connection dropped before Aura could answer. Try again.');
    });
  }).catch(function(e){
    if(e&&e.name==='AbortError'){ finish(); return; }
    failed(navigator.onLine===false?'You are offline.':'Could not reach Aura.');
  });
}

function loadReports(){
  if(!auraReady()){ $('content').innerHTML='<div class="empty">Aura is not set up here.</div>'; return; }
  $('content').innerHTML=skel(3);
  fetch(auraBase()+'/feedback?limit=200',{headers:{'Authorization':'Bearer '+TOKEN}})
  .then(function(r){
    if(r.status===401){ sessionLost(); return null; }
    if(r.status===403) throw new Error('admin only');
    if(r.status===503) throw new Error('unavailable');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    if(!d) return;
    var rows=d.feedback||[];
    if(!rows.length){ $('content').innerHTML='<div class="empty">No reports yet. That is the good outcome.</div>'; return; }
    $('content').innerHTML='<div class="lnkrow" style="margin-bottom:12px">'
      +'<button class="lnk" id="repCsv" type="button">Download CSV</button></div>'
      +'<p class="sec-h">'+rows.length+(rows.length===1?' report':' reports')+'</p>'
      +rows.map(reportCard).join('');
    $('repCsv').addEventListener('click',reportsCsv);
  }).catch(function(e){
    var m=String(e.message);
    $('content').innerHTML='<div class="err">'+esc(
      m==='admin only' ? 'This screen is for the data owner.'
      : m==='unavailable' ? 'The report queue is unavailable right now.'
      : 'Could not load the reports.')+'</div>';

function reportsCsv(){
  fetch(auraBase()+'/feedback.csv?limit=500',{headers:{'Authorization':'Bearer '+TOKEN}})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); })
  .then(function(b){
    var url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download='aura-reports.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }).catch(function(){ toast('Could not download the reports.'); });
}

  });
  $('auraChip').addEventListener('click',function(){ auraMode(AURA_MODE==='client'?'realtor':'client'); });
  $('auraForm').addEventListener('submit',function(e){
    e.preventDefault();
    if(AURA_ABORT){ auraStop(); return; }
    var t=$('auraInput'), q=t.value;
    t.value=''; auraGrow(t);
    auraAsk(q);
  });
  var input=$('auraInput');
  input.addEventListener('input',function(){ auraGrow(input); });
  /* Enter sends on a hardware keyboard; shift+Enter is a newline. On a phone the
     enterkeyhint="send" key fires this too. */
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('auraForm').dispatchEvent(new Event('submit',{cancelable:true})); }
  });
})();
/* Grow with the text, stop at max-height, and only then show a scrollbar.
   The border has to be added back: the box is border-box, so setting height to
   scrollHeight -- which counts content and padding but NOT border -- leaves the
   content 2px short of its own box. The textarea then reports itself as
   overflowing while holding one short line, and the browser paints a scrollbar
   on an empty composer. Reading max-height rather than hardcoding it keeps the
   cap in the stylesheet, where its value can be seen next to the layout. */
function auraGrow(t){
  if(!t) return;
  t.style.height='auto';
  t.style.overflowY='hidden';           // measure unconstrained
  var cs=getComputedStyle(t);
  var border=(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
  var max=parseFloat(cs.maxHeight)||Infinity;
  var want=t.scrollHeight+border;
  t.style.height=Math.min(want,max)+'px';
  t.style.overflowY=want>max?'auto':'hidden';
}

/* back-to-top: appears past ~30% of the page (capped at 1500px so very long
   lists don't hide it), one shared component for every screen */
(function(){
  var btn=$('toTop');
  function update(){
    var scrollable=document.documentElement.scrollHeight-window.innerHeight;
    var threshold=Math.max(300, Math.min(scrollable*0.3, 1500));
    btn.classList.toggle('show', scrollable>600 && window.scrollY>threshold);
    SCROLLPOS[location.hash]=window.scrollY;
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  btn.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});
  });
})();
buildNav();
buildTabs();
var DETAIL_PARENT=null;
document.getElementById('tbBack').addEventListener('click',function(){ go(DETAIL_PARENT||'home'); });
if('scrollRestoration' in history) history.scrollRestoration='manual';   // router owns scroll position
window.addEventListener('hashchange', route);

/* ---- boot ----------------------------------------------------------------
   No token, or one already past its seven days: show the gate and never touch
   the network — signing in is the only thing that screen can do.

   With a live token, render immediately and verify behind it. Blocking on a
   round trip would put a spinner in front of an app built to work offline, and
   a token the server refuses is torn down a moment later anyway. */
/* Two eyes: open when the password is hidden (tap to reveal), struck through when
   it is showing. Drawn here rather than in the markup so both states stay together. */
var EYE={ show:'M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
          hide:'M3 3l18 18|M10.6 6.1A7.9 7.9 0 0 1 12 6c7 0 10.5 6 10.5 6a17 17 0 0 1-3.4 3.9M6.2 8.2A17 17 0 0 0 1.5 12S5 18 12 18a9 9 0 0 0 3.4-.6' };
function paintEye(on){
  var b=$('gate_eye'); if(!b) return;
  b.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + EYE[on?'hide':'show'].split('|').map(function(d){ return '<path d="'+d+'"/>'; }).join('') + '</svg>';
  b.setAttribute('aria-label',on?'Hide password':'Show password');
  b.setAttribute('aria-pressed',on?'true':'false');
}
function toggleEye(){
  var pw=$('gate_pw'); if(!pw) return;
  var on=pw.type==='password';
  pw.type=on?'text':'password';
  paintEye(on);
  try{ pw.focus(); pw.setSelectionRange(pw.value.length,pw.value.length); }catch(e){}
}
function boot(){
  $('gateForm').addEventListener('submit',function(e){ e.preventDefault(); doLogin(); });
  paintEye(false);
  $('gate_eye').addEventListener('click',toggleEye);
  var rem=$('gate_remember'); try{ if(rem) rem.checked=localStorage.getItem('ak_remember')!=='0'; }catch(e){}
  var stored=tokenGet(); WHO=whoGet(); paintNavUser();
  if(!stored){ tokenClear(); showGate(); return; }

  if(tokenAlive(stored)){
    TOKEN=stored; hideGate(); route(); auraWhoAmI(); verifySession(stored);
    return;
  }
  /* The device clock puts this past the window — but a phone with a wrong clock
     must not lock anyone out, so the server gets the final say. Gate while we ask;
     offline there is no ruling to be had, and gated is the safe answer. */
  showGate();
  call('session',{auth:stored}).then(function(r){
    if(r&&r.ok&&r.token){ TOKEN=r.token; tokenSet(TOKEN,WHO); hideGate(); paintNavUser(); route(); auraWhoAmI(); return; }
    tokenClear();
  }).catch(function(){ showGate('You’re offline — sign in once you’re connected.'); });
}
/* Verified behind the render, not in front of it: blocking would put a spinner
   over an app built to work offline, and a refused token is torn down a moment
   later anyway. */
function verifySession(tok){
  call('session',{auth:tok}).then(function(r){
    if(r&&r.ok){
      if(r.token){ TOKEN=r.token; tokenSet(TOKEN,WHO); }   // sliding: the clock restarts
      return;
    }
    /* Only a refusal of the token itself ends the session. Any other non-ok reply
       means the server is unwell, not that the token is -- signing the whole team
       out over that would be the worse failure. */
    if(isAuthErr(r)) sessionLost();
  }).catch(function(){ /* offline — stay in; the cached screens still work */ });
}
boot();
</script>
