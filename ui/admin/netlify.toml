# The Aura Agent admin app. The Netlify site's base directory is ui/admin/;
# VITE_AURA_BASE is set in the site's environment (the Railway URL of aura-chat).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# A refresh or a deep link (/jobs/123) must load the app, not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html names the hashed bundles of the current deploy: never cached, or
# an admin keeps running the old app after a deploy. Keyed on /*, not /index.html:
# Netlify matches headers on the requested path, and a deep link such as /jobs/123
# is index.html under another name. Hashed assets override it below.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The token is in sessionStorage, so a script that runs here can take it. Only
# our own scripts run, and the only server the page may call is Aura's. When
# aura-chat moves, change connect-src here together with VITE_AURA_BASE.
# style-src allows inline: sonner injects its stylesheet at runtime.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://api-dev-cf94.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
